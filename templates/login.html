<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kirish — Ishxona Panel</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { background: #1a1a2e; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .login-card { background: #fff; border-radius: 16px; padding: 40px; width: 100%; max-width: 380px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
</style>
</head>
<body>
<div class="login-card">
  <h4 class="text-center mb-1 fw-bold">🏢 Ishxona Panel</h4>
  <p class="text-center text-muted mb-4">Admin paneliga kirish</p>
  {% for msg in messages %}
  <div class="alert alert-danger py-2">{{ msg }}</div>
  {% endfor %}
  <div class="text-center mb-4">
    <script async src="https://telegram.org/js/telegram-widget.js?22"
      data-telegram-login="Siatstatbot"
      data-size="large"
      data-auth-url="http://kivy.uz:8000/telegram-auth/"
      data-request-access="write">
    </script>
  </div>
  <div class="text-center mb-3">
    <a href="/accounts/google/login/" class="btn btn-outline-danger w-100">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 48 48" class="me-2" style="vertical-align:middle">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.36-8.16 2.36-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Google orqali kirish
    </a>
  </div>
  <div class="d-flex align-items-center mb-3">
    <hr class="flex-grow-1"><span class="mx-2 text-muted small">yoki</span><hr class="flex-grow-1">
  </div>
  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label fw-semibold">Login</label>
      <input type="text" name="username" class="form-control" placeholder="admin" required autofocus>
    </div>
    <div class="mb-4">
      <label class="form-label fw-semibold">Parol</label>
      <input type="password" name="password" class="form-control" placeholder="••••••••" required>
    </div>
    <button type="submit" class="btn btn-primary w-100">Kirish</button>
  </form>
</div>
</body>
</html>
