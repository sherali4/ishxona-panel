{% extends 'base.html' %}
{% block page_title %}{% if action == 'add' %}Korxona qo'shish{% else %}Korxona tahrirlash{% endif %}{% endblock %}
{% block content %}

<div class="row justify-content-center">
<div class="col-md-6">
<div class="card border-0 shadow-sm">
  <div class="card-header bg-white fw-semibold">
    {% if action == 'add' %}Yangi korxona qo'shish{% else %}Korxonani tahrirlash{% endif %}
  </div>
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label fw-semibold">Korxona nomi</label>
        <input type="text" name="nomi" class="form-control" value="{{ korxona.nomi|default:'' }}" required>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">INN (9 raqam)</label>
        <input type="text" name="inn" class="form-control" value="{{ korxona.inn|default:'' }}" maxlength="9" pattern="\d{9}" required>
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">Saqlash</button>
        <a href="/korxonalar/" class="btn btn-outline-secondary">Bekor qilish</a>
      </div>
    </form>
  </div>
</div>
</div>
</div>
{% endblock %}
