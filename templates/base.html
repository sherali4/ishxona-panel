<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ishxona Admin Panel</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
<style>
  body { background: #f0f2f5; }
  .sidebar { min-height: 100vh; background: #1a1a2e; color: #eee; width: 240px; position: fixed; top: 0; left: 0; }
  .sidebar .brand { padding: 20px; font-size: 1.2rem; font-weight: bold; border-bottom: 1px solid #333; }
  .sidebar .nav-link { color: #adb5bd; padding: 10px 20px; }
  .sidebar .nav-link:hover, .sidebar .nav-link.active { color: #fff; background: #16213e; border-left: 3px solid #0f3460; }
  .main { margin-left: 240px; padding: 24px; }
  .topbar { background: #fff; padding: 12px 24px; margin: -24px -24px 24px; border-bottom: 1px solid #dee2e6; display: flex; justify-content: space-between; align-items: center; }
  .stat-card { border-radius: 12px; border: none; }
</style>
</head>
<body>
<div class="sidebar">
  <div class="brand">🏢 Ishxona Panel</div>
  <nav class="nav flex-column mt-3">
    <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
    <a class="nav-link {% if '/users' in request.path %}active{% endif %}" href="/users/"><i class="bi bi-people me-2"></i>Foydalanuvchilar</a>
    <a class="nav-link {% if '/korxonalar' in request.path %}active{% endif %}" href="/korxonalar/"><i class="bi bi-building me-2"></i>Korxonalar</a>
  </nav>
</div>
<div class="main">
  <div class="topbar">
    <span class="fw-semibold text-muted">{% block page_title %}{% endblock %}</span>
    <div>
      <span class="me-3 text-muted"><i class="bi bi-person-circle me-1"></i>{{ request.user.username }}</span>
      <a href="/logout/" class="btn btn-sm btn-outline-secondary"><i class="bi bi-box-arrow-right me-1"></i>Chiqish</a>
    </div>
  </div>
  {% for msg in messages %}
  <div class="alert alert-{% if msg.tags == 'error' %}danger{% else %}{{ msg.tags }}{% endif %} alert-dismissible fade show">
    {{ msg }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  {% endfor %}
  {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
